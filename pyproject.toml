
[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gretl4py"
dynamic = ["version"]
description = "Python bindings for gretl"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Marcin Błażejowski", email = "marcin@gretlconference.org" }
]

dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.7",
    "pandas>=2.3",
    "PySide6>=6.7; sys_platform == 'win32'",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Documentation = "https://gretl.sourceforge.net/gretl4py.html"

[tool.setuptools.packages.find]
where = ["."]
include = ["gretl", "gretl.*"]
exclude = ["**/__pycache__"]

[tool.setuptools.package-data]
"gretl" = [
    "_gretl*",
    "_bundled_addons.txt",
    "_gretl4py_addons.py",
    "_gretl4py_classes.py",
    "_gretl4py_model_api.py",
    "curl-ca-bundle.crt",
    "COPYING",
    "lib/*",
    "data/*",
    "data/gnuplot/*.gpsty",
    "examples/*",
    "functions/*",
    "scripts/*",
    "gretlmpi",
    "gretlmpi.exe",
    "gp-executor",
    "gp-executor.exe",
    "mpi/**/*",
]
