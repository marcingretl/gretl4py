[binaries]
cpp = 'clang++'
c = 'clang'
ar = 'llvm-ar'
strip = 'llvm-strip'
python = 'python'

[properties]
cpp_std = 'c++17'
c_args = ['-O3', '-pipe', '-fstack-protector-strong', '-D_FORTIFY_SOURCE=2']
cpp_args = ['-O3', '-pipe', '-fstack-protector-strong', '-D_FORTIFY_SOURCE=2']
link_args = ['-L"E:/Marcin/gretlapi/stack_minimal/lib"', '-lgretl-1.0', '-lxml2', '-lfftw3', '-lglib-2.0', '-lintl', '-lgobject-2.0', '-lm']


[env]
# Set the Python environment variables correctly
PYTHON_PATH = 'C:/Program Files/Python311'
PYTHON_INCLUDES = 'C:/Program Files/Python311/include'
PYTHON_LIBS = 'C:/Program Files/Python311/libs'
PYTHON_VER = '3.11'

# Python link flags
PYTHONLD = '-L"{PYTHON_LIBS}" -lpython{PYTHON_VER} -lversion -lshlwapi -lpathcch -lbcrypt'
